apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie-proxy-service
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nessie-proxy-service
  template:
    metadata:
      labels:
        app: nessie-proxy-service
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-config
